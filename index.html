<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>GLORY STORE — Contemporary Fashion</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Glory Store: premium clothing, shoes, bags and accessories.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap">
<style>
:root{--bg:#faf8f4;--fg:#111;--bg2:#efe9de;--mut:#77736b;--line:#ddd6c9;--ac:#111;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root:not([data-theme="light"]){}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f0f;--fg:#f2eee6;--bg2:#1a1917;--mut:#9b968b;--line:#2d2b27;--ac:#f2eee6;--ac2:#111;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0f0f;--fg:#f2eee6;--bg2:#1a1917;--mut:#9b968b;--line:#2d2b27;--ac:#f2eee6;--ac2:#111;color-scheme:dark}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--fg);font:400 14px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.lg{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;letter-spacing:.02em}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}a{color:inherit}
.b{background:var(--ac);color:var(--ac2);padding:12px 24px;letter-spacing:.14em;text-transform:uppercase;font-size:12px;transition:.3s}.b:hover{opacity:.8}.b.o{background:none;color:var(--fg);border:1px solid var(--fg)}
input,select{background:var(--bg);border:1px solid var(--line);padding:10px 12px;width:100%}
.top{background:var(--ac);color:var(--ac2);text-align:center;font-size:12px;letter-spacing:.12em;padding:7px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hr{display:flex;align-items:center;gap:16px;padding:12px 4vw}.logo{font-size:26px;letter-spacing:.3em;cursor:pointer;white-space:nowrap}
.sr{position:relative;flex:1;max-width:420px;margin-left:auto}.sg{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--line);z-index:30}.sg div{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between}.sg div:hover{background:var(--bg2)}
.ic{position:relative;padding:6px 8px}.ic i{position:absolute;top:-2px;right:-2px;background:var(--ac);color:var(--ac2);font-size:10px;border-radius:9px;padding:0 5px;font-style:normal}
nav{display:flex;gap:22px;padding:0 4vw 10px;overflow-x:auto;white-space:nowrap;font-size:12px;letter-spacing:.12em;text-transform:uppercase}nav a{cursor:pointer;color:var(--mut)}nav a:hover,nav a.on{color:var(--fg)}
main{min-height:70vh;animation:fi .5s}@keyframes fi{from{opacity:0;transform:translateY(10px)}}
.sec{padding:60px 4vw}.sec h2{font-size:clamp(28px,4vw,44px);margin-bottom:24px;display:flex;justify-content:space-between;align-items:baseline}.sec h2 a{font:12px Inter;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;color:var(--mut)}
.hero{display:grid;grid-template-columns:1.1fr 1fr;min-height:80vh;background:#141311;color:#f2eee6}.hero>div:first-child{padding:8vw 5vw;align-self:center}.hero h1{font-size:clamp(48px,8vw,110px);line-height:.95;margin:16px 0 28px}.hero .im{display:grid;grid-template-columns:1fr 1fr}.hero .im div{overflow:hidden}.hero .im div:nth-child(2){margin-top:12vh}.hero .im svg,.hero .im img{width:100%;height:100%;transition:transform 6s}.hero:hover .im svg,.hero:hover .im img{transform:scale(1.08)}
.hero .b{background:#f2eee6;color:#111}.hero .b.o{background:none;color:#f2eee6;border-color:#f2eee6;margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px 16px}
.cd{position:relative;cursor:pointer}.cd .im{aspect-ratio:3/4;overflow:hidden;background:var(--bg2);position:relative}.cd svg,.cd img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s}.cd:hover svg,.cd:hover img{transform:scale(1.07)}
.cd .qa{position:absolute;left:0;right:0;bottom:0;background:var(--ac);color:var(--ac2);text-align:center;padding:9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;transform:translateY(100%);transition:.3s}.cd:hover .qa{transform:none}
.cd h3{font:500 13px Inter;margin-top:10px}.cd small{color:var(--mut)}.pr s{color:var(--mut);margin-left:6px}.pr em{color:#b3372c;font-style:normal;margin-left:6px;font-size:12px}
.tg{position:absolute;top:8px;left:8px;background:#b3372c;color:#fff;font-size:11px;padding:2px 8px;z-index:2}.hb{position:absolute;top:6px;right:8px;z-index:2;font-size:20px;text-shadow:0 0 4px #fff8}
.cmp{position:absolute;bottom:8px;left:8px;z-index:2;font-size:11px;background:var(--bg);padding:2px 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.tile{background:var(--bg2);padding:34px 18px;text-align:center;cursor:pointer;font-size:22px;transition:.3s}.tile:hover{background:var(--ac);color:var(--ac2)}
.col{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.col div{padding:60px 30px;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;cursor:pointer;font-size:30px}
.fl{background:var(--bg2);display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:24px;padding:16px 20px}.fl b{font:600 28px "Cormorant Garamond",serif;letter-spacing:.1em}
.shop{display:grid;grid-template-columns:250px 1fr;gap:30px;padding:30px 4vw}.fp label{display:block;padding:3px 0;cursor:pointer}.fp h4{font:500 12px Inter;letter-spacing:.14em;text-transform:uppercase;margin:20px 0 8px}
.ov{position:fixed;inset:0;background:#0009;z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow:auto;animation:fi .25s}.ov.r{justify-content:flex-end}
.md{background:var(--bg);width:min(1000px,100%);margin:3vh auto;padding:28px;position:relative}.dr{background:var(--bg);width:min(430px,100%);min-height:100%;padding:24px}.x{position:absolute;top:10px;right:14px;font-size:24px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:28px}.zm{aspect-ratio:3/4;overflow:hidden;cursor:zoom-in;background:var(--bg2)}.zm svg,.zm img{width:100%;height:100%;object-fit:cover;transition:transform .2s}.zm:hover svg,.zm:hover img{transform:scale(2)}
.th{display:flex;gap:8px;margin-top:8px}.th div{width:64px;aspect-ratio:3/4;overflow:hidden;cursor:pointer;border:1px solid var(--line)}.th .on{border-color:var(--fg)}
.ch{display:inline-block;border:1px solid var(--line);padding:6px 12px;margin:0 6px 6px 0;cursor:pointer}.ch.on{background:var(--ac);color:var(--ac2)}.sw{width:26px;height:26px;border-radius:50%;display:inline-block;margin-right:8px;cursor:pointer;border:2px solid var(--line)}.sw.on{outline:2px solid var(--fg);outline-offset:2px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.ci .t{width:70px;aspect-ratio:3/4;overflow:hidden}.ci .t svg,.ci .t img{width:100%;height:100%;object-fit:cover}
.fab{position:fixed;right:16px;z-index:40;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 18px #0004}
.nl{background:var(--ac);color:var(--ac2);text-align:center;padding:70px 4vw}.nl input{max-width:340px;display:inline-block;color:#111;background:#fff}.nl .b{background:#f2eee6;color:#111}
footer{padding:40px 4vw 90px;color:var(--mut);font-size:12px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ac2);padding:10px 20px;z-index:99}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}.st div{background:var(--bg2);padding:16px}.st b{font:600 28px "Cormorant Garamond",serif;display:block}
.tb{overflow-x:auto}.tb input{padding:5px;width:80px}.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
@media(max-width:800px){.hero,.pd,.shop{grid-template-columns:1fr}.hero .im{height:50vh}.sr{max-width:none}.fp{display:none}.fp.s{display:block}.hr .hd{display:none}}
.th img,.cd img,.zm img,.ci img,.hero .im img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}.ad{display:grid;grid-template-columns:190px 1fr;gap:24px;padding:24px 4vw}.ad aside{display:flex;flex-direction:column;gap:2px}.ad aside a{padding:10px 12px;cursor:pointer;color:var(--mut)}.ad aside a.on,.ad aside a:hover{background:var(--bg2);color:var(--fg)}.ad h3{font-size:24px;margin:22px 0 8px}.ad section{min-width:0}.ad td input,.ad td select{padding:5px}@media(max-width:800px){.ad{grid-template-columns:1fr}.ad aside{flex-direction:row;overflow-x:auto}}</style></head><body>

padd:()=>{const n=$("#n1").value.trim(),pr=+$("#n3").value;if(!n||!pr)return toast("Name and price required");const id=Math.max(0,...S.prods.map(p=>p.id))+1;S.prods.push({id,name:n,cat:$("#n2").value,brand:S.set.name,price:pr,orig:pr,stock:+$("#n4").value||0,rating:4.5,pop:0,date:id,colors:["Black"],sizes:["S","M","L"],desc:"New arrival.",imgs:[],nw:1});log("Added "+n);cm()},
exp:()=>{OUT=JSON.stringify(S.prods.map(({imgs,...r})=>r),null,1);rr()},
imp:()=>{try{const a=JSON.parse($("#imp").value);let n=Math.max(0,...S.prods.map(p=>p.id));a.forEach(r=>S.prods.push({colors:["Black"],sizes:["S","M","L"],rating:4.5,pop:0,stock:0,desc:"",cat:S.cats[0],imgs:[],...r,orig:r.orig??r.price,price:r.price??r.orig,id:++n,date:n}));log("Imported "+a.length);cm()}catch(e){toast("Invalid JSON")}},
cadd:()=>{const v=$("#nc").value.trim();if(v&&!S.cats.includes(v)){S.cats.push(v);log("Category "+v);cm()}},con:t=>{const c=S.cats[+t.dataset.i];S.coff=t.checked?S.coff.filter(x=>x!=c):[...S.coff,c];log("Toggle category "+c);cm()},cmv:t=>{mv(S.cats,+t.dataset.i,+t.dataset.d);cm()},
cdel:t=>{const c=S.cats[+t.dataset.i];if(S.prods.some(p=>p.cat==c))return toast("Move its products first");if(confirm("Delete "+c+"?")){S.cats.splice(+t.dataset.i,1);log("Deleted category "+c);cm()}},
oadd:()=>{S.off.push({n:"New offer",t:"pct",v:10,x:0,sc:"",ids:"",s:"",e:"",on:1});log("New offer");cm()},odel:t=>{if(confirm("Delete offer?")){S.off.splice(+t.dataset.i,1);log("Deleted offer");cm()}},
cpadd:()=>{S.cp.push({c:"NEWCODE",t:"pct",v:10,min:0,lim:0,used:0,exp:"",cat:"",on:1});log("New coupon");cm()},cpdel:t=>{if(confirm("Delete coupon?")){S.cp.splice(+t.dataset.i,1);log("Deleted coupon");cm()}},
hmv:t=>{mv(S.hp.sec,+t.dataset.i,+t.dataset.d);log("Reordered homepage");cm()},hclr:()=>{S.hp.img="";cm()},lclr:()=>{S.set.logo="";cm()},
oexp:()=>{OUT="id,customer,date,total,status,payment\n"+S.orders.map(o=>[o.id,o.u,o.date,o.t.toFixed(2),o.st,o.pay||""].join(",")).join("\n");rr()},
inv:t=>{const o=S.orders[+t.dataset.i];open(`<div class="md"><button class="x" data-a="close">×</button><h2>Invoice #${o.id}</h2><p>${S.set.name} · ${S.set.email}<br>Customer: ${o.u} · ${o.date}</p><table>${o.items.map(i=>`<tr><td>${i.n}</td><td>×${i.q}</td><td>${m$(i.p*i.q)}</td></tr>`).join("")}<tr><td colspan=2><b>Total</b></td><td><b>${m$(o.t)}</b></td></tr></table><p>Status: ${o.st} · Payment: ${o.pay||"Unpaid"}</p><button class="b" data-x="prn">Print</button></div>`)},prn:()=>print(),
legal:(t,e)=>{e.preventDefault();open(`<div class="md"><button class="x" data-a="close">×</button><h2>${t.dataset.k=="priv"?"Privacy policy":"Terms & conditions"}</h2><p>${S.set[t.dataset.k]||"Not published yet."}</p></div>`)},
async alogin(){const p=$("#apw").value,now=Date.now();if(S.lh.filter(l=>!l.ok&&now-l.t<3e5).length>=5)return toast("Too many attempts. Wait 5 minutes.");const ok=S.pw?await sha(p)==S.pw:p=="5656";S.lh.unshift({t:now,ok});S.lh=S.lh.slice(0,50);if(!ok){sv();return toast("Wrong password")}S.ses=now+6048e5;log("Login");sv();rr()},
async apw(){const o=$("#op").value,n=$("#np").value;if(!(S.pw?await sha(o)==S.pw:o=="5656"))return toast("Current password is wrong");if(n.length<8||n=="5656"||n!=$("#cp2").value)return toast("Use 8+ characters, not 5656, and confirm it");S.pw=await sha(n);S.must=0;log("Password changed");sv();toast("Password updated");rr()},
alogout:()=>{S.ses=0;log("Logout");sv();go("home")}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-x]");if(t&&X[t.dataset.x])X[t.dataset.x](t,e)});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;if(d.s!=null){if(d.s=="q"){AQ=t.value;rr()}else{const o=d.o,n=t.value.trim();if(n&&!S.cats.includes(n)){S.cats[S.cats.indexOf(o)]=n;S.prods.forEach(p=>{if(p.cat==o)p.cat=n});log("Renamed "+o+" → "+n);cm()}}return}
if(d.u!=null){const fl=[...t.files];if(!fl.length)return;Promise.all(fl.map(rs)).then(r=>{if(d.u=="hero")S.hp.img=r[0];else if(d.u=="logo")S.set.logo=r[0];else S.prods[+d.u].imgs=[...(S.prods[+d.u].imgs||[]),...r];log("Uploaded image");cm();toast("Image saved")});return}
if(!d.y)return;let v=t.type=="checkbox"?t.checked:t.type=="number"?+t.value:d.t=="list"?t.value.split(",").map(x=>x.trim()).filter(Boolean):t.value;const o=gp(d.y);if(/^cp\.\d+\.c$/.test(d.y))v=v.toUpperCase();
if(/^orders\.\d+\.st$/.test(d.y)&&["Cancelled","Refunded"].includes(v)&&!["Cancelled","Refunded"].includes(o))S.orders[+d.y.split(".")[1]].items.forEach(i=>{const p=S.prods.find(x=>x.name==i.n);if(p)p.stock+=i.q});
sp(d.y,v);log("Edit "+d.y+" → "+(Array.isArray(v)?v.join("/"):v));sv();upd()});
S.users=S.users.filter(u=>!u.admin);if(S.user&&S.user.admin)S.user=null;
if(location.hash=="#admin")V.v="admin";addEventListener("hashchange",()=>{if(location.hash=="#admin"){V.v="admin";render()}});
if(S.theme)document.documentElement.dataset.theme=S.theme;render();
</script></body></html>
