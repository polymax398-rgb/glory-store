<html lang="en">

<title>GLORY STORE — Contemporary Fashion</title>

<style>
:root{--bg:#faf8f4;--fg:#111;--bg2:#efe9de;--mut:#77736b;--line:#ddd6c9;--ac:#111;--ac2:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--fg);font:400 14px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.lg{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
.b{background:var(--ac);color:var(--ac2);padding:12px 24px;letter-spacing:.14em;text-transform:uppercase;font-size:12px;transition:.3s;display:inline-flex;align-items:center;justify-content:center;gap:6px}

.b.o{background:none;color:var(--fg);border:1px solid var(--fg)}
.b.sm{padding:7px 13px;font-size:11px;letter-spacing:.06em}
.b.dng{background:#b3372c;color:#fff;border-color:#b3372c}
.b.ok{background:#236b43;color:#fff;border-color:#236b43}
input,select,textarea{background:var(--bg);border:1px solid var(--line);padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:1px solid var(--fg)}
.top{background:var(--ac);color:var(--ac2);text-align:center;font-size:12px;letter-spacing:.12em;padding:7px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hr{display:flex;align-items:center;gap:14px;padding:12px 4vw}
.logo{font-size:26px;letter-spacing:.3em;cursor:pointer;white-space:nowrap}
.sr{position:relative;flex:1;max-width:420px;margin-left:auto}
.sg{position:absolute;top:100%;left:0;right:0;background:var(--bg);border:1px solid var(--line);z-index:30;max-height:300px;overflow:auto}
.sg div{padding:9px 12px;cursor:pointer;display:flex;justify-content:space-between}
.sg div:hover{background:var(--bg2)}
.ic{position:relative;padding:6px 8px;font-size:17px;display:inline-flex;align-items:center;gap:5px}
.ic i{position:absolute;top:-2px;right:-2px;background:var(--ac);color:var(--ac2);font-size:10px;border-radius:9px;padding:0 5px;font-style:normal}
.ic span.uname{font-size:12px;font-weight:500;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:22px;padding:0 4vw 10px;overflow-x:auto;white-space:nowrap;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
nav a{cursor:pointer;color:var(--mut);text-decoration:none}
nav a:hover,nav a.on{color:var(--fg)}
main{min-height:70vh;animation:fi .4s}

.sec{padding:60px 4vw}
.sec h2{font-size:clamp(28px,4vw,44px);margin-bottom:24px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px}

.hero .im{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:24px}
.hero .im div{overflow:hidden;background:#22201d}
.hero .im div:nth-child(2){margin-top:10vh}

.cd{position:relative;cursor:pointer}
.cd .im{aspect-ratio:3/4;overflow:hidden;background:var(--bg2);position:relative}

.chk-list{display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow:auto;padding:8px;border:1px solid var(--line);background:var(--bg)}

  .hero,.pd,.shop{grid-template-columns:1fr}
  .hero .im{height:48vh}
  .sr{max-width:none}
  .fp{display:none}
  .fp.s{display:block}
  .hr .hd{display:none}
  .ad{grid-template-columns:1fr}
  .ad aside{flex-direction:row;overflow-x:auto}
  .ad aside a{white-space:nowrap}

</style>
</head>

/* ==========================================================================
   2. HYBRID CLOUD + LOCAL PERSISTENCE & FRESH VISITOR SESSION
   ========================================================================== */
const STORAGE_KEY = "GLORY_STORE_DATA_V2";
const USERS_KEY   = "GLORY_STORE_USERS_V1";

function normalizeDB(parsed) {
  if (!parsed) return JSON.parse(JSON.stringify(DEFAULT_DATA));
  return {
    settings: {
      ...DEFAULT_DATA.settings,
      ...(parsed.settings || {}),
      icons: { ...DEFAULT_DATA.settings.icons, ...(parsed.settings?.icons || {}) },
      hero: { ...DEFAULT_DATA.settings.hero, ...(parsed.settings?.hero || {}) },
      discounts: { ...DEFAULT_DATA.settings.discounts, ...(parsed.settings?.discounts || {}) }
    },
    categories: Array.isArray(parsed.categories) ? parsed.categories : DEFAULT_DATA.categories,
    products: Array.isArray(parsed.products) ? parsed.products : DEFAULT_DATA.products
  };
}

function loadLocalStore() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return normalizeDB(JSON.parse(saved));
  } catch (e) {}
  return normalizeDB(null);
}

function loadLocalUsers() {
  try { return JSON.parse(localStorage.getItem(USERS_KEY) || "{}"); } catch { return {}; }
}

let DB = loadLocalStore();
let usersDB = loadLocalUsers();

function getCloudUrl() {
  const url = (DB.settings.firebaseUrl || HARDCODED_FIREBASE_URL || "").trim();
  return url ? url.replace(/\/+$/, "") : "";
}

async function syncFromCloud() {
  const base = getCloudUrl();
  if (!base) return;
  try {
    const [storeRes, usersRes] = await Promise.all([
      fetch(`${base}/store.json`),
      fetch(`${base}/users.json`)
    ]);
    if (storeRes.ok) {
      const remoteStore = await storeRes.json();
      if (remoteStore && remoteStore.products) {
        remoteStore.settings = remoteStore.settings || {};
        remoteStore.settings.firebaseUrl = base;
        DB = normalizeDB(remoteStore);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      } else {
        await pushStoreToCloud();
      }
    }
    if (usersRes.ok) {
      const remoteUsers = await usersRes.json();
      if (remoteUsers && typeof remoteUsers === "object") {
        usersDB = remoteUsers;
        localStorage.setItem(USERS_KEY, JSON.stringify(usersDB));
      }
    }
    render();
  } catch (e) {
    console.warn("Cloud sync offline, using cached data.", e);
  }
}

async function pushStoreToCloud() {
  const base = getCloudUrl();
  if (!base) return;
  try {
    await fetch(`${base}/store.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(DB)
    });
  } catch (e) { console.error(e); }
}

async function pushSingleUserToCloud(username) {
  const base = getCloudUrl();
  if (!base || !usersDB[username]) return;
  const safeKey = encodeURIComponent(username.replace(/[.#$\[\]]/g, "_"));
  try {
    await fetch(`${base}/users/${safeKey}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(usersDB[username])
    });
  } catch (e) { console.error(e); }
}

function getUserKey(uname) {
  return uname.replace(/[.#$\[\]]/g, "_");
}

/* ==========================================================================
   3. PRICING & DISCOUNT CALCULATION ENGINE
   ========================================================================== */
function getProductPricing(p) {
  const d = DB.settings.discounts;
  let pct = Number(p.discountPercent) || 0;

  if (d.categoryDiscounts && Array.isArray(p.cats)) {
    p.cats.forEach(cId => {
      const cPct = Number(d.categoryDiscounts[cId]) || 0;
      if (cPct > pct) pct = cPct;
    });
  }

  if (d.globalEnabled) {
    const gPct = Number(d.globalPercent) || 0;
    if (gPct > pct) pct = gPct;
  }

  pct = Math.min(95, Math.max(0, pct));
  const orig = Number(p.price) || 0;
  const final = pct > 0 ? Math.round(orig * (1 - pct / 100) * 100) / 100 : orig;
  return { orig, final, pct, onSale: pct > 0 };
}

function fmtPrice(val) {
  return `${DB.settings.currency}${Number(val).toFixed(val % 1 === 0 ? 0 : 2)}`;
}

async function handleUserRegister(e) {
  e.preventDefault();
  const uname = $("regUser").value.trim();
  const pass = $("regPass").value;
  if (!uname || !pass) return;

  const btn = $("btnRegSub");
  if (btn) { btn.disabled = true; btn.textContent = "جاري التحقق..."; }

  const k = getUserKey(uname);
  const base = getCloudUrl();

  if (base) {
    try {
      const res = await fetch(`${base}/users/${encodeURIComponent(k)}.json`);
      if (res.ok) {
        const remoteAcc = await res.json();
        if (remoteAcc) {
          toast("اسم المستخدم موجود بالفعل، اختر اسماً آخر أو سجل الدخول");
          if (btn) { btn.disabled = false; btn.textContent = "إنشاء الحساب وحفظ بياناتي"; }
          return;
        }
      }
    } catch {}
  }

  if (usersDB[k]) {
    toast("اسم المستخدم موجود بالفعل، اختر اسماً آخر أو سجل الدخول");
    if (btn) { btn.disabled = false; btn.textContent = "إنشاء الحساب وحفظ بياناتي"; }
    return;
  }

  usersDB[k] = {
    username: uname,
    password: pass,
    cart: JSON.parse(JSON.stringify(cart)),
    wish: [...wish],
    appliedCoupon: appliedCoupon
  };
  localStorage.setItem(USERS_KEY, JSON.stringify(usersDB));
  await pushSingleUserToCloud(k);

  currentUser = uname;
  closeOv();
  render();
  toast(`تم إنشاء الحساب وتفعيل الحفظ التلقائي لـ ${uname}`);
}

async function handleUserLogin(e) {
  e.preventDefault();
  const uname = $("authUser").value.trim();
  const pass = $("authPass").value;
  const k = getUserKey(uname);

  const btn = $("btnLoginSub");
  if (btn) { btn.disabled = true; btn.textContent = "جاري الدخول..."; }

  const base = getCloudUrl();
  if (base) {
    try {
      const res = await fetch(`${base}/users/${encodeURIComponent(k)}.json`);
      if (res.ok) {
        const remoteAcc = await res.json();
        if (remoteAcc) usersDB[k] = remoteAcc;
      }
    } catch {}
  }

  const account = usersDB[k];
  if (!account || account.password !== pass) {
    toast("اسم المستخدم أو كلمة المرور غير صحيحة");
    if (btn) { btn.disabled = false; btn.textContent = "دخول واسترجاع بياناتي"; }
    return;
  }

  currentUser = account.username || uname;

  const savedCart = Array.isArray(account.cart) ? JSON.parse(JSON.stringify(account.cart)) : [];
  cart.forEach(guestItem => {
    const found = savedCart.find(x => x.id === guestItem.id && x.size === guestItem.size && x.color === guestItem.color);
    if (found) found.qty += guestItem.qty;
    else savedCart.push(guestItem);
  });
  cart = savedCart;

  const savedWish = Array.isArray(account.wish) ? [...account.wish] : [];
  wish.forEach(wId => { if (!savedWish.includes(wId)) savedWish.push(wId); });
  wish = savedWish;

  appliedCoupon = account.appliedCoupon || appliedCoupon;
  syncCurrentUserData();

  closeOv();
  render();
  toast(`مرحباً بعودتك ${currentUser}! تم استرجاع سلتك وبياناتك`);
}

function logoutUser() {
  syncCurrentUserData();
  currentUser = null;
  cart = [];
  wish = [];
  compareList = [];
  appliedCoupon = null;
  closeOv();
  render();
  toast("تم تسجيل الخروج وإعادة تهيئة الجلسة");
}

function openCartDrawer() {
  let subtotal = 0;
  const rows = cart.map((item, idx) => {
    const p = DB.products.find(x => x.id === item.id);
    if (!p) return "";
    const pr = getProductPricing(p);
    subtotal += pr.final * item.qty;
    return `
      <div class="ci">
        <div class="t"><img src="${(p.imgs && p.imgs[0]) || IM.w1}"></div>
        <div style="flex:1">
          <div style="font-weight:500">${p.name}</div>

            <button class="b o sm" onclick="updCartQty(${idx},-1)">-</button>
            <span>${item.qty}</span>
            <button class="b o sm" onclick="updCartQty(${idx},1)">+</button>
            <button style="margin-left:auto;color:#b3372c;font-size:12px" onclick="updCartQty(${idx},-999)">Remove</button>

        </div>
      </div>

  const total = Math.max(0, subtotal - couponDisc);

  $("ov").innerHTML = `
    <div class="ov r" onclick="if(event.target===this)closeOv()">

function closeOv() { $("ov").innerHTML = ""; }

function addToCart(id, size, color) {
  const p = DB.products.find(x => x.id === id);
  if (!p) return;
  const sz = size || (p.sizes && p.sizes[0]) || "One Size";
  const cl = color || (p.colors && p.colors[0]) || "#111111";
  const existing = cart.find(i => i.id === id && i.size === sz && i.color === cl);
  if (existing) existing.qty++;
  else cart.push({ id, size: sz, color: cl, qty: 1 });
  saveCart();
  toast(currentUser ? `Added "${p.name}" & saved to ${currentUser}` : `Added "${p.name}" to bag`);
}

function updCartQty(idx, delta) {
  if (!cart[idx]) return;
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  saveCart();
  openCartDrawer();
}

function toggleWish(id) {
  const i = wish.indexOf(id);
  if (i >= 0) wish.splice(i, 1);
  else wish.push(id);
  saveWish();
  if (UI.view !== "admin") render();
}

function applyCouponCode(code) {
  const cObj = (DB.settings.discounts.coupons || []).find(c => c.active && c.code.toUpperCase() === code.trim().toUpperCase());
  if (!cObj) {
    toast("Invalid or inactive promo code");
    appliedCoupon = null;
  } else {
    appliedCoupon = cObj.code.toUpperCase();
    toast(`Coupon ${appliedCoupon} (-${cObj.percent}%) applied!`);
  }
  syncCurrentUserData();
  openCartDrawer();
}

function checkoutWhatsApp(total) {
  const lines = cart.map(i => {
    const p = DB.products.find(x => x.id === i.id);
    const pr = getProductPricing(p);
    return `• ${p.name} (${i.size}) ×${i.qty} = ${fmtPrice(pr.final * i.qty)}`;
  });
  const customerLine = currentUser ? `Customer: ${currentUser}\n` : "";
  const msg = `New Order — ${DB.settings.storeName}\n${customerLine}\n${lines.join("\n")}\n${appliedCoupon ? `Coupon: ${appliedCoupon}\n` : ""}Total: ${fmtPrice(total)}`;
  const wa = (DB.settings.whatsapp || "").replace(/\D/g, "");
  window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, "_blank");
}

function handleImageFile(inputEl, callback) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 600;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL("image/jpeg", 0.78));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

                return `

                    <td>${fmtPrice(p.price)}</td>

                        ? `<button class="b dng sm" onclick="setProductDiscount('${p.id}', 0)">إزالة الخصم</button>`

          </table>

      <div class="ad-box">
        <h3>🎟️ 4. أكواد الخصم (Promo Codes) في السلة</h3>
        <form class="row" onsubmit="addCoupon(event)">

              <span class="badge sale">-${c.percent}%</span>
              <button style="color:#b3372c;font-size:12px" onclick="DB.settings.discounts.coupons.splice(${i},1);saveDB('تم حذف الكوبون');render()">حذف</button>
            </div>

  if (UI.adminTab === "appearance") {
    const s = DB.settings;
    content = `

      <form onsubmit="saveGeneralSettings(event)">

          <h3>🏪 الهوية الأساسية وبيانات التواصل</h3>

            <div><label>أيقونة الواتساب</label><input id="ic5" value="${s.icons.whatsapp}"></div>

        <div class="ad-box">
          <h3>🖼️ الواجهة الرئيسية (Hero Section)</h3>
          <div class="ad-grid">

  return `
    <div class="ad">
      <aside>
        <div style="padding:8px 12px;font-weight:700;border-bottom:1px solid var(--line);margin-bottom:6px">لوحة الإدارة</div>
        ${tabs.map(t => `<a class="${UI.adminTab === t.id ? "on" : ""}" onclick="UI.adminTab='${t.id}';render()">${t.label}</a>`).join("")}

/* ==========================================================================
   9. ADMIN ACTIONS & EXPORT FUNCTIONS
   ========================================================================== */
async function connectFirebaseUrl(url) {
  DB.settings.firebaseUrl = (url || "").trim().replace(/\/+$/, "");
  saveDB("جاري المزامنة مع السحابة...");
  await pushStoreToCloud();
  toast("تم الربط والمزامنة السحابية بنجاح!");
  render();
}

function saveProductForm(e) {
  e.preventDefault();
  const name = $("pName").value.trim();
  const price = Number($("pPrice").value) || 0;
  const discountPercent = Number($("pDisc").value) || 0;
  const badge = $("pBadge").value.trim();
  const sizes = $("pSizes").value.split(",").map(s => s.trim()).filter(Boolean);
  const colors = $("pColors").value.split(",").map(s => s.trim()).filter(Boolean);
  const desc = $("pDesc").value.trim();
  const imgs = $("pImgs").value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const cats = [...document.querySelectorAll('input[name="pCats"]:checked')].map(el => el.value);

  if (UI.editProdId) {
    const idx = DB.products.findIndex(p => p.id === UI.editProdId);
    if (idx >= 0) {
      DB.products[idx] = { ...DB.products[idx], name, price, discountPercent, badge, sizes, colors, desc, imgs: imgs.length ? imgs : [IM.w1], cats };
    }
    UI.editProdId = null;
    saveDB("تم تحديث المنتج وحفظه للجميع");
  } else {
    DB.products.unshift({
      id: "p_" + Date.now(),
      name, price, discountPercent, badge, sizes, colors, desc,
      imgs: imgs.length ? imgs : [IM.w1],
      cats
    });
    saveDB("تمت إضافة المنتج الجديد ونشره للجميع");
  }
  render();
}

function quickUpdatePrice(id, val) {
  const p = DB.products.find(x => x.id === id);
  if (p) {
    p.price = Math.max(0, Number(val) || 0);
    saveDB("تم تحديث السعر ونشره للجميع");
    render();
  }
}

function deleteProduct(id) {
  if (!confirm("هل تريد حذف هذا المنتج نهائياً؟")) return;
  DB.products = DB.products.filter(p => p.id !== id);
  saveDB("تم حذف المنتج وتحديث المتجر");
  render();
}

function saveCategoryForm(e) {
  e.preventDefault();
  const name = $("cName").value.trim();
  const icon = $("cIcon").value.trim();
  const showNav = $("cNav").value === "1";

  if (UI.editCatId) {
    const c = DB.categories.find(x => x.id === UI.editCatId);
    if (c) { c.name = name; c.icon = icon; c.showNav = showNav; }
    UI.editCatId = null;
    saveDB("تم تحديث القسم وحفظه");
  } else {
    const id = name.toLowerCase().replace(/[^a-z0-9\u0600-\u06FF]+/g, "-") + "-" + Math.floor(Math.random() * 999);
    DB.categories.push({ id, name, icon, showNav });
    saveDB("تمت إضافة القسم الجديد ونشره");
  }
  render();
}

function deleteCategory(id) {
  if (!confirm("هل تريد حذف هذا القسم؟")) return;
  DB.categories = DB.categories.filter(c => c.id !== id);
  DB.products.forEach(p => { p.cats = (p.cats || []).filter(cid => cid !== id); });
  saveDB("تم حذف القسم وتحديث المتجر");
  render();
}

function toggleProductCategory(prodId, catId, isAdded) {
  window._assignCat = catId;
  const p = DB.products.find(x => x.id === prodId);
  if (!p) return;
  p.cats = p.cats || [];
  if (isAdded && !p.cats.includes(catId)) p.cats.push(catId);
  if (!isAdded) p.cats = p.cats.filter(c => c !== catId);
  saveDB("تم تحديث قسم المنتج");
}

function setCategoryDiscount(catId, pct) {
  DB.settings.discounts.categoryDiscounts = DB.settings.discounts.categoryDiscounts || {};
  DB.settings.discounts.categoryDiscounts[catId] = Math.min(95, Math.max(0, Number(pct) || 0));
  saveDB("تم تحديث خصم القسم");
  render();
}

function setProductDiscount(prodId, pct) {
  const p = DB.products.find(x => x.id === prodId);
  if (p) {
    p.discountPercent = Math.min(95, Math.max(0, Number(pct) || 0));
    saveDB("تم تحديث خصم المنتج");
    render();
  }
}

function clearAllDiscounts() {
  if (!confirm("هل تريد إزالة جميع التخفيضات عن كل المنتجات والأقسام؟")) return;
  DB.settings.discounts.globalEnabled = false;
  DB.settings.discounts.categoryDiscounts = {};
  DB.products.forEach(p => { p.discountPercent = 0; });
  saveDB("تمت إزالة جميع التخفيضات");
  render();
}

function addCoupon(e) {
  e.preventDefault();
  const code = $("newCpnCode").value.trim().toUpperCase();
  const percent = Math.min(95, Math.max(1, Number($("newCpnPct").value) || 10));
  DB.settings.discounts.coupons = DB.settings.discounts.coupons || [];
  DB.settings.discounts.coupons.push({ code, percent, active: true });
  saveDB("تمت إضافة الكوبون " + code);
  render();
}

function saveGeneralSettings(e) {
  e.preventDefault();
  const s = DB.settings;
  s.firebaseUrl = ($("sFb").value || "").trim().replace(/\/+$/, "");
  s.storeName = $("sName").value.trim() || "GLORY STORE";
  s.currency = $("sCurr").value.trim() || "$";
  s.whatsapp = $("sWa").value.trim();
  s.adminPass = $("sPass").value.trim() || "222555888admin";
  s.topBar = $("sTop").value.trim();
  s.footerText = $("sFoot").value.trim();
  s.icons = {
    account: $("ic1").value.trim() || "👤",
    wishlist: $("ic2").value.trim() || "♡",
    theme: $("ic3").value.trim() || "◐",
    cart: $("ic4").value.trim() || "🛍",
    whatsapp: $("ic5").value.trim() || "✆"
  };
  s.hero.eyebrow = $("hEye").value.trim();
  s.hero.title = $("hTit").value.trim();
  s.hero.subtitle = $("hSub").value.trim();
  s.hero.img1 = $("hImg1").value.trim();
  s.hero.img2 = $("hImg2").value.trim();
  saveDB("تم حفظ جميع الإعدادات ومزامنتها");
  render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "glory-store-backup.json";
  a.click();
}

function importJSON(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.products && data.categories) {
        DB = normalizeDB(data);
        saveDB("تم استيراد البيانات ومزامنتها");
        render();
      } else alert("ملف غير صالح");
    } catch { alert("خطأ في قراءة الملف"); }
  };
  r.readAsText(file);
}

function exportUpdatedHTML() {
  let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const fbUrl = getCloudUrl();
  html = html.replace(/const HARDCODED_FIREBASE_URL = ".*?";/, `const HARDCODED_FIREBASE_URL = "${fbUrl}";`);
  const markerStart = "const DEFAULT_DATA = ";
  const markerEnd = ";\n\n/* ==========================================================================\n   2. HYBRID CLOUD";
  const sIdx = html.indexOf(markerStart);
  const eIdx = html.indexOf(markerEnd);
  if (sIdx !== -1 && eIdx !== -1) {
    html = html.slice(0, sIdx + markerStart.length) + JSON.stringify(DB, null, 2) + html.slice(eIdx);
  }
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  a.click();
  toast("تم تنزيل ملف index.html!");
}

/* ==========================================================================
   10. MAIN RENDER, SECRET KEYBOARD TRIGGER & GLOBAL EVENT DELEGATION
   ========================================================================== */
function render() {
  renderChrome();
  $("fb").style.display = UI.view === "shop" ? "inline-flex" : "none";
  if (UI.view === "home") $("app").innerHTML = renderHome();
  else if (UI.view === "shop") $("app").innerHTML = renderShop();
  else if (UI.view === "admin") $("app").innerHTML = renderAdmin();
}

let secretFiveCount = 0;
let secretFiveTimer = null;
document.addEventListener("keydown", e => {
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  if (e.key === "5") {
    secretFiveCount++;
    clearTimeout(secretFiveTimer);
    secretFiveTimer = setTimeout(() => { secretFiveCount = 0; }, 4000);
    if (secretFiveCount >= 10) {
      secretFiveCount = 0;
      UI.view = "admin";
      render();
      window.scrollTo(0, 0);
    }
  } else {
    secretFiveCount = 0;
  }
});

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const act = el.dataset.a;

  if (act === "go") {
    UI.view = el.dataset.v;
    if (el.dataset.c) {
      UI.cat = el.dataset.c;
      UI.onlySale = el.dataset.c === "sale";
    }
    render();
    window.scrollTo(0, 0);
  }
  else if (act === "acc") openAccountModal();
  else if (act === "pd") {
    if (e.target.closest("button")) return;
    openProductModal(el.dataset.id);
  }
  else if (act === "qadd") {
    e.stopPropagation();
    addToCart(el.dataset.id);
  }
  else if (act === "tgw") {
    e.stopPropagation();
    toggleWish(el.dataset.id);
  }
  else if (act === "cmp") {
    e.stopPropagation();
    const id = el.dataset.id;
    const i = compareList.indexOf(id);
    if (i >= 0) compareList.splice(i, 1);
    else if (compareList.length < 3) compareList.push(id);
    else toast("Max 3 items to compare");
    render();
  }
  else if (act === "opencmp") openCompareModal();
  else if (act === "cart") openCartDrawer();
  else if (act === "wl") openWishlistDrawer();
  else if (act === "ff") $("fp")?.classList.toggle("s");
  else if (act === "th") {
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
  }
});

$("q").addEventListener("input", e => {
  const val = e.target.value;
  UI.search = val;
  const sg = $("sg");
  if (!val.trim()) { sg.hidden = true; if (UI.view === "shop") render(); return; }
  const matches = DB.products.filter(p => p.name.toLowerCase().includes(val.toLowerCase())).slice(0, 5);
  if (matches.length) {
    sg.hidden = false;
    sg.innerHTML = matches.map(p => {
      const pr = getProductPricing(p);
      return `<div onclick="$('sg').hidden=true;openProductModal('${p.id}')"><span>${p.name}</span><b>${fmtPrice(pr.final)}</b></div>`;
    }).join("");
  } else {
    sg.hidden = true;
  }
});

$("q").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    $("sg").hidden = true;
    UI.view = "shop";
    UI.cat = "all";
    render();
  }
});

document.addEventListener("change", e => {
  if (e.target && e.target.id === "assignCatSel") {
    window._assignCat = e.target.value;
    render();
  }
});

render();
syncFromCloud();
</script>
